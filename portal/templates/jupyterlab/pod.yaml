apiVersion: v1
kind: Pod
metadata:
  labels:
    notebook-id: {{notebook_id}}
    notebook-name: {{notebook_name}}
    k8s-app: jupyterlab
    owner: {{owner}}
    globus-id: {{globus_id}}
    time2delete: ttl-{{hours_remaining}}
  name: {{notebook_id}}
  namespace: {{namespace}}
spec:
  # Notebooks never call the Kubernetes API, so don't mount the namespace's
  # default ServiceAccount token into them. This prevents a user with a shell
  # in a notebook from harvesting the SA token and acting against the cluster
  # API with whatever that SA is granted.
  automountServiceAccountToken: false
  # Hard backstop: the kubelet kills this pod after MAX_LIFETIME_HOURS
  # regardless of hours_remaining (the label above), so a bypassed or buggy
  # request-time duration check can't produce an unkillable pod.
  activeDeadlineSeconds: {{active_deadline_seconds}}
  {% if gpu_request %}
  nodeSelector:
    nvidia.com/gpu.product: "{{gpu_product}}"
  {% else %}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: partition
            operator: NotIn
            values:
            - gpu
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 10
        preference:
          matchExpressions:
          - key: partition
            operator: In
            values:
            - login
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: "Exists"
      effect: "NoSchedule"
  {% endif %}
  containers:
  - name: {{notebook_id}}
    args:
    # - /.run
    - {{start_script}}
    env:
    # Read from the notebook's Secret rather than set inline: inline values are
    # part of the pod spec, which anyone able to read pods can see.
    - name: "JUPYTER_TOKEN"
      valueFrom:
        secretKeyRef:
          name: {{notebook_id}}
          key: jupyter-token
    - name: API_TOKEN
      valueFrom:
        secretKeyRef:
          name: ciconnect-creds
          key: token
    - name: OWNER
      value: {{owner}}
    - name: OWNER_UID
      value: "{{owner_uid}}"
    - name: CONNECT_GROUP
      value: atlas-af
    - name: CONNECT_GID
      value: "5741"
    image: {{image}}
    imagePullPolicy: Always
    ports:
    - containerPort: 9999
    resources:
      limits:
        cpu: "{{cpu_limit}}"
        memory: {{memory_limit}}
        nvidia.com/gpu: "{{gpu_limit}}"
      requests:
        cpu: "{{cpu_request}}"
        memory: {{memory_request}}
        nvidia.com/gpu: "{{gpu_request}}"
    volumeMounts:
      # Only the owner's own home and data directories, not every user's.
      - name: nfs-home
        mountPath: "/home/{{owner}}"
        subPath: "{{owner}}"
      - name: ceph-data
        mountPath: "/data/{{owner}}"
        subPath: "{{owner}}"
      - name: ceph-work
        mountPath: /work
      - name: ceph-cold
        mountPath: /cold
      - name: cvmfs
        mountPath: /cvmfs
        mountPropagation: HostToContainer
      - name: shm-volume
        mountPath: /dev/shm
      - name: krb5-conf
        mountPath: /etc/krb5.conf
        subPath: krb5.conf
        readOnly: true
  restartPolicy: Always
  volumes:
    - name: shm-volume
      emptyDir:
        medium: Memory
    - name: nfs-home
      nfs: 
        server: nfs.af.uchicago.edu
        path: /export/home
    - name: ceph-data
      hostPath:
        path: /data
    - name: ceph-work
      hostPath:
        path: /work
    - name: ceph-cold
      hostPath:
        path: /cold
    - name: cvmfs
      persistentVolumeClaim:
        claimName: cvmfs
    - name: krb5-conf
      configMap:
        name: krb5-conf
