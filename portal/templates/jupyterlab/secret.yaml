apiVersion: v1
kind: Secret
metadata:
  labels:
    k8s-app: jupyterlab
    owner: {{owner}}
  name: {{notebook_id}}
  namespace: {{namespace}}
type: Opaque
# `token` is read back by get_notebook() to build the notebook URL. Because it
# sits under `data`, Kubernetes stores the decoded bytes and the API returns
# the token string again, so its format is kept as is for existing notebooks.
data:
  token: {{token}}
# The token string itself, for the pod's JUPYTER_TOKEN (see pod.yaml), so the
# token is not written into the pod spec.
stringData:
  jupyter-token: "{{token}}"