apiVersion: v1
kind: Service
metadata:
  labels:
    k8s-app: jupyterlab
  name: {{notebook_id}}
  namespace: {{namespace}}
spec:
  selector:
    notebook-id: {{notebook_id}}
  ports:
  - port: 80
    targetPort: 9999
  # ClusterIP, not NodePort: the notebook is reached only through its ingress
  # (TLS). A NodePort exposed it over plain HTTP on every node's public IP.
  type: ClusterIP