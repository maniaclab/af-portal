apiVersion: v1
kind: ConfigMap
metadata:
  name: krb5-conf
  namespace: {{namespace}}
  labels:
    k8s-app: jupyterlab
data:
  krb5.conf: |
    [logging]
     default = FILE:/var/log/krb5libs.log
     kdc = FILE:/var/log/krb5kdc.log
     admin_server = FILE:/var/log/kadmind.log

    # original (default) settings

    # [libdefaults]
    #  default_realm = EXAMPLE.COM
    #  dns_lookup_realm = false
    #  dns_lookup_kdc = false
    #  ticket_lifetime = 24h
    #  renew_lifetime = 7d
    #  forwardable = true
    #
    # [realms]
    #  EXAMPLE.COM = {
    #   kdc = kerberos.example.com
    #   admin_server = kerberos.example.com
    #  }
    #
    # [domain_realm]
    #  .example.com = EXAMPLE.COM
    #  example.com = EXAMPLE.COM

    # settings for CERN.CH realm

    [libdefaults]
      default_realm = CERN.CH
      ticket_lifetime = 24h
      renew_lifetime = 7d
      forwardable = true
      proxiable = true

    [realms]
      CERN.CH = {
        default_domain = cern.ch
        kpasswd_server = afskrb5m.cern.ch
        admin_server = afskrb5m.cern.ch
        kdc = cerndc.cern.ch
      }

    [domain_realm]
      cern.ch = CERN.CH
      .cern.ch = CERN.CH
